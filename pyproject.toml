[tool.pytest.ini_options]
# Configuration settings from pytest.ini
asyncio_mode = "strict"
pythonpath = "aggregator"
testpaths = "tests"

# Addopts setting (recommended for strict marker checking)
addopts = "--strict-markers"

# Marker definitions (using TOML array syntax, which is correct here)
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "mock: mock tests",
    "db: database tests",
    "integration: integration tests",
    "mutmut: tests made for mutmut",
]

[tool.mypy]
exclude = [
    ".+site-packages/hypothesis/.+",
]

[tool.poetry]
name = "aggregator"
version = "0.1.0"
description = ""
authors = ["JL"]

[tool.poetry.dependencies]
python = "^3.11"
beanie = "^1.11.6"
nest-asyncio = "^1.5.5"
pydantic-settings = "^2.12.0"

[tool.poetry.group.dev.dependencies]
bandit = "^1.7.4"
beanie = "^1.11.6"
pip-chill = "^1.0.1"
pytest-asyncio = "^1.4.1"
pytest-bdd = "^9.0.1"
pytest-coverage = "^0.0"
pytest = "^9.0.3"
ruff = "^0.17.3"
mutmut = "^2.4.1"
poetry = "^2.3.3"
hammett = "^0.9.3"
pytest-helpers-namespace = "^2021.12.29"
pytest-mock-resources = "^2.4.3"
python-on-whales = "^0.79.0"
hypothesis = {extras = ["codemods"], version = "^6.54.3"}
mypy = "^1.0"
motor-stubs = "^1.7.1"
Faker = "^14.1.0"
pydantic = {extras = ["dotenv"], version = "^2.0"}


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
